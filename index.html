<title>梦想小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: floating toy-like panels on a cool paper desk — catalog on the left, live 3D room on the right, quiz & shop as big friendly dialogs */
:root{
  --desk:#E8EDF5; --panel:#FFFFFF; --panel-2:#F3F6FB; --ink:#1C2340; --ink-2:#5A6383; --line:#DCE2ED;
  --blue:#2E6BFF; --blue-d:#1D4FD0; --sun:#FFB21E; --sun-d:#D98B00; --mint:#14AE7B; --mint-d:#0B8A5F;
  --coral:#FF5C61; --berry:#E2489A; --berry-d:#B22F78;
  --f-display:"Baloo 2","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-cn:"ZCOOL KuaiLe","Baloo 2","PingFang SC",system-ui,sans-serif;
  --f-body:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-block:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- title bar ---------- */
.titlebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:48px}
.lights{display:flex;gap:8px;padding-right:4px}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand .name{font-family:var(--f-cn);font-size:27px;line-height:1;letter-spacing:.02em}
.brand .tag{font:600 12px var(--f-display);color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 0 var(--line)}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg svg{width:16px;height:16px}
.spacer{flex:1}
.goal{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.goal .bar{width:84px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.goal b{font-family:var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.stars{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:5px 14px 5px 8px;box-shadow:inset 0 0 0 2px var(--sun)}
.stars svg{width:24px;height:24px}
.stars span{font:800 21px var(--f-display);font-variant-numeric:tabular-nums;min-width:2.2ch;line-height:1}
.stars.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.96)}}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:20px;height:20px}
.btn{border:0;cursor:pointer;font:700 16px var(--f-display);padding:9px 18px 8px;border-radius:14px;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn svg{width:18px;height:18px}
.btn-sun{background:var(--sun);box-shadow:0 4px 0 var(--sun-d);color:#3B2500}
.btn-sun:active{box-shadow:0 1px 0 var(--sun-d)}
.btn-berry{background:var(--berry);box-shadow:0 4px 0 var(--berry-d)}
.btn-berry:active{box-shadow:0 1px 0 var(--berry-d)}
.btn-mint{background:var(--mint);box-shadow:0 4px 0 var(--mint-d)}
.btn-mint:active{box-shadow:0 1px 0 var(--mint-d)}
.btn-ghost{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn-ghost:active{box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- main ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:304px minmax(0,1fr);gap:14px}
.side{background:var(--panel);border-radius:22px;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 0 var(--line),0 18px 40px -26px rgba(28,35,64,.35)}
.tabs{display:flex;gap:6px;padding:12px 12px 10px}
.tabs button{flex:1;border:0;background:var(--panel-2);border-radius:12px;padding:9px 0;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:#fff}
.panel{flex:1;overflow:auto;padding:0 12px 16px;min-height:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 12px}
.filters button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.filters button.on{color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue);background:#EEF3FF}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 6px 9px;background:var(--panel-2);border:2px solid transparent;border-radius:16px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.thumb{width:100%;aspect-ratio:1;max-width:100%;border-radius:11px;background:radial-gradient(circle at 50% 38%,#fff 0%,#E4EAF4 100%);display:grid;place-items:center;overflow:hidden;margin-bottom:5px}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph{width:40%;aspect-ratio:1;border-radius:50%;background:var(--line);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.nm{font-weight:800;font-size:14px;padding:0 3px}
.en{font:600 13px var(--f-display);color:var(--ink-2);padding:0 3px}
.price{position:absolute;top:11px;right:11px;background:var(--berry);color:#fff;font:700 13px var(--f-display);padding:2px 8px 1px 5px;border-radius:999px;display:flex;align-items:center;gap:3px;line-height:1.3}
.price svg{width:13px;height:13px}
.lock{position:absolute;top:11px;left:11px;width:24px;height:24px;border-radius:8px;background:rgba(28,35,64,.78);display:grid;place-items:center}
.lock svg{width:13px;height:13px}
.card.locked .thumb img{filter:saturate(.55) brightness(1.04)}
.owned{position:absolute;top:11px;right:11px;background:#E3F7EE;color:var(--mint-d);font:700 12px var(--f-display);padding:1px 8px;border-radius:999px}
.sect{font:800 13px var(--f-body);letter-spacing:.06em;color:var(--ink-2);margin:14px 2px 10px;display:flex;justify-content:space-between}
.sect:first-child{margin-top:4px}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0;position:relative}
.sw i{width:100%;aspect-ratio:1.25;max-width:100%;border-radius:14px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);background-size:cover;background-position:center}
.sw.on i{box-shadow:0 0 0 3px var(--panel),0 0 0 5.5px var(--blue)}
.sw.on{color:var(--ink)}
.sw .price{top:6px;right:6px;font-size:11.5px}
.sw .lock{top:6px;left:6px;width:20px;height:20px}

/* ---------- stage ---------- */
.stage{position:relative;border-radius:22px;overflow:hidden;min-height:0;background:radial-gradient(120% 95% at 55% 25%,#FBFCFE 0%,#DCE3EE 100%);box-shadow:0 18px 40px -26px rgba(28,35,64,.35);transition:background .5s}
.stage.toon{background:radial-gradient(circle at 1px 1px,rgba(226,72,154,.13) 1.4px,transparent 1.6px) 0 0/22px 22px,radial-gradient(120% 95% at 55% 25%,#FFF8EA 0%,#FFD9E6 100%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.areanav{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;z-index:2}
.areanav::-webkit-scrollbar{display:none}
.areanav button{flex:none;border:0;cursor:pointer;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink-2);font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 0 var(--line)}
.areanav button b{font:800 11px var(--f-display);color:var(--ink-2);background:var(--panel-2);border-radius:6px;padding:1px 5px;line-height:1.4}
.areanav button.on{background:var(--ink);color:#fff}
.areanav button.on b{background:rgba(255,255,255,.18);color:#fff}
.areanav button.add{background:#FCE6F1;color:var(--berry-d)}
.areanav button.add svg{width:13px;height:13px}
.areanav .sep{flex:none;width:1px;background:rgba(28,35,64,.14);margin:4px 2px}
.areanav svg{width:15px;height:15px}
.arealabel{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:7px 12px 8px;border-radius:12px;pointer-events:none;white-space:nowrap;z-index:3;box-shadow:0 10px 24px -8px rgba(20,25,50,.5)}
.dressdlg{width:min(960px,100%)}
.dressbody{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:20px;padding:12px 24px 8px}
.dprev{display:flex;flex-direction:column;gap:10px;min-width:0}
#dressCv{width:100%;aspect-ratio:4/5;border-radius:22px;background:radial-gradient(circle at 50% 38%,#FFFFFF 0,#EEF3FF 55%,#DDE7FA 100%);cursor:grab;touch-action:none;display:block}
.kname{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--ink-2)}
.kname input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:800 16px var(--f-body);color:var(--ink);background:var(--panel-2)}
.kname input:focus{outline:none;border-color:var(--blue);background:#fff}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{border:0;cursor:pointer;background:var(--panel-2);color:var(--ink);font:800 13px var(--f-body);padding:7px 12px;border-radius:999px}
.acts button:hover{background:#E6ECF7}
.acts button.on{background:var(--sun);color:#3B2500}
.dopts{min-width:0;display:flex;flex-direction:column}
.dopts .tabs{padding:0 0 2px}
#dressOpts{max-height:min(480px,calc(100vh - 290px));overflow:auto;padding:0 4px 4px 0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.lcard{position:relative;border:2px solid transparent;background:var(--panel-2);border-radius:16px;padding:4px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:800 12.5px var(--f-body);color:var(--ink)}
.lcard img{width:100%;aspect-ratio:1;border-radius:12px;background:#fff;display:block}
.lcard:hover{border-color:#C9D6F2}
.lcard.on{border-color:var(--blue);background:#EAF1FF}
.lcard.locked img{opacity:.8}
.lcard em,.ldot em{position:absolute;top:6px;right:6px;font-style:normal;display:flex;align-items:center;gap:2px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 6px 2px 4px;line-height:1.2}
.lcard em svg,.ldot em svg{width:11px;height:11px}
.ldots{display:flex;flex-wrap:wrap;gap:12px;padding:2px}
.ldot{position:relative;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.ldot.on{box-shadow:0 0 0 3px var(--blue)}
.ldot em{top:-9px;right:-16px}
.dbuy{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFF5FA;border:2px dashed #F3B6D3;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px}
.dbuy span{flex:1;min-width:170px}
.dbuy b{color:var(--berry-d);margin:0 3px}
.dbuy small{font-weight:800;color:var(--berry-d)}
.dbuy .btn{font-size:14px;padding:7px 12px 6px}
.dbuy .btn svg{width:14px;height:14px}
.dtip{margin:6px 24px 22px;padding:10px 14px;border-radius:14px;background:var(--panel-2);color:var(--ink-2);font-weight:700;font-size:13px}
.dtip b{color:var(--ink)}
.lnote{color:var(--ink-2);font-weight:700;font-size:13px;margin:12px 2px}
@media (max-width:760px){.dressbody{grid-template-columns:1fr}#dressCv{aspect-ratio:1;max-height:320px}}
.kidcard{width:100%;display:flex;align-items:center;gap:10px;border:0;background:linear-gradient(135deg,#FFF3DE,#FFE6EF);border-radius:16px;padding:8px 10px 8px 8px;cursor:pointer;text-align:left}
.kidcard img{width:52px;height:52px;border-radius:13px;background:#fff;flex:none}
.kidcard .t{flex:1;min-width:0;font-weight:800;font-size:15px;color:var(--ink)}
.kidcard small{display:block;font-size:12px;color:var(--ink-2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kidcard .go{flex:none;background:var(--mint);color:#fff;font-weight:800;font-size:13px;padding:6px 10px;border-radius:999px}
.seltools button.kid{background:var(--sun);color:#3B2500}
.seltools button.kid:hover{background:#FFC54D}
.portals{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.portal{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.portal button{pointer-events:auto;border:0;cursor:pointer;background:rgba(255,255,255,.94);color:var(--ink);font:800 12.5px var(--f-body);padding:5px 12px 5px 5px;border-radius:999px;display:flex;align-items:center;gap:7px;box-shadow:0 8px 18px -8px rgba(20,25,50,.55),0 0 0 1px rgba(28,35,64,.06);white-space:nowrap;transition:transform .15s}
.portal button:hover{transform:scale(1.06)}
.portal button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1}
.portal button.out i{background:var(--mint)}
.arealabel small{display:block;font-weight:700;color:#AEB8D8;font-size:11.5px}
#panelHouse{padding-top:12px}
.roomlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.roomcard{background:var(--panel-2);border-radius:14px;padding:10px 10px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;border:2px solid transparent}
.roomcard:hover{border-color:var(--blue)}
.roomcard b{font:800 11px var(--f-display);color:var(--blue);letter-spacing:.04em}
.roomcard.out b{color:var(--mint-d)}
.roomcard .rn{font-weight:800;font-size:14px}
.roomcard .rc{font-size:12px;font-weight:700;color:var(--ink-2)}
.addfloor{margin-top:10px;width:100%;border:2px dashed #F3B6D3;background:#FFF5FA;border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.addfloor .t{flex:1;font-weight:800;font-size:14px;color:var(--berry-d)}
.addfloor .t small{display:block;font-weight:700;color:var(--ink-2);font-size:12px;margin-top:2px}
.addfloor .price{position:static}
.seltools{position:absolute;transform:translate(-50%,calc(-100% - 12px));display:flex;gap:2px;background:var(--ink);padding:5px;border-radius:14px;box-shadow:0 10px 24px -8px rgba(20,25,50,.5);z-index:3;white-space:nowrap}
.seltools::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.seltools button{color:#fff;background:transparent;border:0;font-weight:800;font-size:13px;padding:6px 10px;border-radius:9px;display:flex;align-items:center;gap:5px;cursor:pointer;position:relative;z-index:1}
.seltools button:hover{background:rgba(255,255,255,.14)}
.seltools button svg{width:16px;height:16px}
.seltools .danger{color:#FF9EA1}
.seltools .nmtag{color:#9AA6CC;font-size:12px;font-weight:800;padding:0 8px 0 6px;display:flex;align-items:center}
.hint{position:absolute;left:16px;bottom:16px;z-index:1;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 180px)}
.hint b{color:var(--ink)}

.stage-actions .btn{font-size:14px;padding:7px 12px 6px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,26,52,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--panel);border-radius:28px;width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 40px 90px -30px rgba(10,15,40,.6);position:relative;animation:rise .28s cubic-bezier(.2,1.3,.4,1)}

.dhead{display:flex;align-items:center;gap:12px;padding:22px 24px 4px;flex-wrap:wrap}
.dtitle{font-family:var(--f-cn);font-size:30px;line-height:1.1}
.dsub{color:var(--ink-2);font-size:14px;font-weight:700}
.close{margin-left:auto;width:40px;height:40px;border-radius:13px;border:0;background:var(--panel-2);cursor:pointer;display:grid;place-items:center}

.dbody{padding:16px 24px 24px}

.levels{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.levels .lab{font-weight:800;font-size:14px;color:var(--ink-2)}
.subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.subj{border:0;border-radius:22px;padding:18px 18px 16px;color:#fff;text-align:left;cursor:pointer;min-height:176px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;position:relative;overflow:hidden;transition:transform .1s;box-shadow:0 6px 0 var(--sh)}
.subj:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.subj.math{background:var(--blue);--sh:var(--blue-d)}
.subj.en{background:var(--mint);--sh:var(--mint-d)}
.subj.gk{background:var(--berry);--sh:var(--berry-d)}
.subj.cn{background:#FF7A3D;--sh:#D4561C}
.subj.cn .glyph{font-family:var(--f-cn);font-weight:400}
.subj .glyph{font:800 54px/0.9 var(--f-display);letter-spacing:-.02em}
.subj .gk-dots{display:flex;gap:0}
.subj .gk-dots i{width:34px;height:34px;border-radius:50%;margin-right:-10px;box-shadow:0 0 0 3px var(--berry)}
.subj h4{margin:0;font:400 22px var(--f-cn)}
.subj p{margin:2px 0 0;font-size:13px;font-weight:700;opacity:.85}
.rules{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rule{background:var(--panel-2);border-radius:16px;padding:12px 12px 10px}
.rule b{display:flex;align-items:center;gap:4px;font:800 20px var(--f-display);color:var(--ink)}
.rule b svg{width:18px;height:18px}
.rule span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.daily{margin-top:14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.daily .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.daily .bar i{display:block;height:100%;background:var(--mint)}

.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--panel-2);color:var(--ink-2)}
.pill.subj-math{background:#E8EFFF;color:var(--blue)}.pill.subj-en{background:#E1F6EE;color:var(--mint-d)}.pill.subj-gk{background:#FCE6F1;color:var(--berry-d)}.pill.subj-cn{background:#FFEDE3;color:#C2410C}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:8px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--mint)}.dots i.no{background:var(--coral)}.dots i.cur{background:var(--ink)}
.streak{font:800 14px var(--f-display);color:#E8590C;display:flex;align-items:center;gap:4px}
.streak svg{width:16px;height:16px}
.qmain{padding:22px 0 8px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qvisual{font-size:92px;line-height:1.05;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08))}
.qtext{font:700 30px/1.35 var(--f-display);max-width:30ch;text-wrap:balance}
.qtext.big{font-size:52px;letter-spacing:.04em}
.qprompt{font:800 22px/1.45 var(--f-body);max-width:32ch;text-wrap:balance}
.qprompt.small{font-size:16px;color:var(--ink-2)}
.qsw{display:flex;align-items:center;gap:12px;font:800 30px var(--f-display);color:var(--ink-2)}
.qsw i{width:64px;height:64px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.say{border:0;background:#E1F6EE;color:var(--mint-d);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.say svg{width:16px;height:16px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--panel-2);border:3px solid var(--line);font:700 22px var(--f-display);cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:left;transition:transform .08s;position:relative;min-width:0}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--panel);display:grid;place-items:center;font:800 15px var(--f-display);color:var(--ink-2)}
.opt[disabled]{cursor:default}
.opt.right{background:#E2F8EF;border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.opt.right .k{background:var(--mint);color:#fff}
.opt.wrong{background:#FFEAEA;border-color:var(--coral);box-shadow:0 4px 0 var(--coral)}
.opt.wrong .k{background:var(--coral);color:#fff}
.opt.dim{opacity:.5}
.feedback{margin-top:18px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;flex-wrap:wrap}
.feedback.ok{background:#E2F8EF}.feedback.no{background:#FFF1E6}
.feedback .fb-t{font:400 24px var(--f-cn)}
.feedback.ok .fb-t{color:var(--mint-d)}.feedback.no .fb-t{color:#C2410C}
.feedback .fb-e{flex:1;min-width:200px;font-size:14.5px;font-weight:700;color:var(--ink-2);line-height:1.5}
.fly{position:fixed;z-index:80;pointer-events:none;font:800 26px var(--f-display);color:var(--sun-d);display:flex;align-items:center;gap:4px;animation:fly 1s ease-out forwards;text-shadow:0 2px 0 #fff}
.fly svg{width:26px;height:26px}
@keyframes fly{to{transform:translateY(-90px) scale(1.2);opacity:0}}
.summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0 4px}
.summary .big{font:800 72px/1 var(--f-display);color:var(--sun-d);display:flex;align-items:center;gap:8px}
.summary .big svg{width:64px;height:64px}
.summary .rows{display:flex;flex-direction:column;gap:6px;min-width:min(340px,100%);margin:6px 0 10px}
.summary .rows div{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding:8px 14px;border-radius:12px;background:var(--panel-2)}
.summary .rows div span:last-child{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{background:var(--panel-2);border-radius:18px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.scard.focus{border-color:var(--berry);animation:bump .6s}
.scard .thumb{margin:0}
.scard .row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px}
.scard .cost{display:flex;align-items:center;gap:3px;font:800 17px var(--f-display);color:var(--sun-d)}
.scard .cost svg{width:16px;height:16px}
.scard .btn{justify-content:center;font-size:14px;padding:7px 10px 6px;margin:2px 4px 0}
.scard .need{font-size:12px;font-weight:800;color:var(--ink-2);text-align:center}
.shophead{display:flex;align-items:center;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:14.5px;z-index:90;box-shadow:0 16px 40px -10px rgba(10,15,40,.5);animation:rise .25s;max-width:calc(100% - 40px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95;width:100%;height:100%}

@media (max-width:860px){

  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .stage{order:-1;height:62vh;min-height:340px}
  .side{max-height:none}
  .panel{overflow:visible}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .goal{display:none}
  .subjects{grid-template-columns:minmax(0,1fr)}
  .subj{min-height:auto}
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hint{display:none}
  .brand .tag{display:none}
}

}

const LOOK = { hair: HAIRS, hairC: HAIRC, top: TOPS, bottom: BOTTOMS, topC: CLOTHC, bottomC: CLOTHC, shoes: SHOES, hat: HATS, back: BACKS, skin: SKINS };
const lookOpt = (slot, id) => LOOK[slot].find(x => x.id === id) || LOOK[slot][0];
const lookLocked = (slot, id) => !!lookOpt(slot, id).price && !owns(`look:${slot}:${id}`);
const ONE_PIECE = ['dress', 'princess', 'hero', 'astro', 'overall'];

const clothSpecs = {};
const cloth = (hex, k = '') => clothSpecs[hex + k] || (clothSpecs[hex + k] = k === 'stripe' ? (() => {
  const [c, x] = cv(64, 64); x.fillStyle = '#F7F5F0'; x.fillRect(0, 0, 64, 64); x.fillStyle = hex; for (let i = 0; i < 4; i++) x.fillRect(0, i * 16, 64, 8);
  const t = tex(c); return S({ color: '#ffffff', map: t, toonMap: t, rough: .85 });
})() : S({ color: hex, rough: k === 'gloss' ? .3 : .85, double: k === 'double' }));
const wingSpec = S({ color: '#D9F2FF', rough: .2, opacity: .6, double: true, emissive: '#9FE0FF', ei: .3 });
function hairCap(r) { return geo('hcap' + r, () => new THREE.SphereGeometry(r, 26, 12, 0, PI * 2, 0, 1.05)); }
function hairBack(r, th) { return geo(`hback${r},${th}`, () => new THREE.SphereGeometry(r, 26, 14, PI / 2 + .9, PI * 2 - 1.8, 0, th)); }
const cone = (r, h, s = 12) => geo(`cone${r},${h},${s}`, () => new THREE.ConeGeometry(r, h, s));
function aim(m, dir) { m.quaternion.setFromUnitVectors(UP, dir.clone().normalize()); return m; }

function buildHair(H, style, hs) {
  const base = (th = 1.7, r = .16) => { part(H, hairCap(r), hs, 0, 0, 0, { r: [-.15, 0, 0] }); part(H, hairBack(r, th), hs, 0, 0, 0); };
  const tail = (x, y, z, s = 1) => part(H, sph(.062 * s, 16, 12), hs, x, y, z, { s: [.8, 1.6, .8] });
  if (style === 'short') base(1.55);
  else if (style === 'pony') { base(); part(H, sph(.07, 16, 12), hs, 0, .07, -.16); tail(0, -.05, -.2); part(H, sph(.025, 10, 8), GLOSS.coral, 0, .03, -.19, { noOutline: true }); }
  else if (style === 'twin') { base(); for (const s of [-1, 1]) { tail(s * .16, -.04, -.05); part(H, sph(.026, 10, 8), GLOSS.yellow, s * .15, .05, -.06, { noOutline: true }); } }
  else if (style === 'bun') { base(1.6); part(H, sph(.08, 18, 14), hs, 0, .17, -.04); }
  else if (style === 'bob') { part(H, hairCap(.166), hs, 0, 0, 0, { r: [-.1, 0, 0] }); part(H, hairBack(.17, 2.05), hs, 0, 0, 0, { s: [1.05, 1, 1.04] }); }
  else if (style === 'long') { base(1.8); part(H, rbox(.3, .36, .07, .03), hs, 0, -.13, -.11); for (const s of [-1, 1]) part(H, rbox(.05, .3, .1, .025), hs, s * .145, -.1, -.03); }
  else if (style === 'curly') {
    base(1.5, .155);
    for (let i = 0; i < 26; i++) { const th = .25 + (i % 5) * .32, ph = i * 2.399; const d = V(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph)); if (d.z > .35 && d.y < .55) continue; part(H, sph(.055, 12, 10), hs, d.x * .165, d.y * .165, d.z * .165); }
  } else if (style === 'spiky') {
    base(1.45);
    for (const [x, y, z] of [[0, 1, .2], [.45, .85, 0], [-.45, .85, 0], [0, .8, -.5], [.4, .6, -.55], [-.4, .6, -.55], [.2, .95, .35], [-.2, .95, .35]]) { const d = V(x, y, z).normalize(); aim(part(H, cone(.045, .13, 8), hs, d.x * .15, d.y * .15, d.z * .15), d); }
  }
}
function buildHat(H, id, L) {
  if (id === 'bow') { const b = new THREE.Group(); b.position.set(.1, .12, .02); b.rotation.z = -.5; H.add(b); for (const s of [-1, 1]) part(b, cone(.045, .08), GLOSS.coral, s * .045, 0, 0, { r: [0, 0, s * PI / 2] }); part(b, sph(.025, 12, 10), GLOSS.coral, 0, 0, 0); }
  else if (id === 'cap') { const c = cloth((lookOpt('topC', L.topC)).hex); part(H, geo('capTop', () => new THREE.SphereGeometry(.172, 24, 10, 0, PI * 2, 0, 1.25)), c, 0, .01, 0, { r: [-.12, 0, 0] }); part(H, rbox(.2, .018, .13, .008), c, 0, .07, .17, { r: [.18, 0, 0] }); }
  else if (id === 'glasses') { for (const s of [-1, 1]) part(H, torus(.04, .008), SP.ink, s * .055, .012, .148); part(H, box(.03, .008, .008), SP.ink, 0, .02, .15); }
  else if (id === 'flower') { const f = new THREE.Group(); f.position.set(-.1, .1, .07); f.rotation.set(.3, -.6, 0); H.add(f); for (let i = 0; i < 5; i++) { const a = i / 5 * PI * 2; part(f, sph(.028, 10, 8), BLOOM.pink, Math.cos(a) * .035, Math.sin(a) * .035, 0, { s: [1, 1, .5] }); } part(f, sph(.02, 10, 8), GLOSS.yellow, 0, 0, .01); }
  else if (id === 'headphones') { part(H, torus(.168, .016, PI), GLOSS.lilac, 0, 0, -.01); for (const s of [-1, 1]) part(H, cyl(.055, .055, .05, 18), GLOSS.lilac, s * .165, 0, -.01, { r: [0, 0, PI / 2] }); }
  else if (id === 'cat') { const hs = cloth(lookOpt('hairC', L.hairC).hex); for (const s of [-1, 1]) { const e = part(H, cone(.05, .1, 4), hs, s * .09, .14, -.01, { r: [0, PI / 4, s * -.35] }); part(e, cone(.028, .06, 4), SP.pinkNose, 0, -.005, .015, { noOutline: true }); } }
  else if (id === 'crown') {
    const gold = SP.brass, c = new THREE.Group(); c.position.set(0, .15, -.01); c.rotation.x = -.15; H.add(c);
    part(c, cyl(.085, .09, .06, 24, true), cloth('#E9BC52', 'double'), 0, 0, 0, { noOutline: true });
    for (let i = 0; i < 6; i++) { const a = i / 6 * PI * 2; part(c, cone(.022, .06, 6), gold, Math.cos(a) * .087, .055, Math.sin(a) * .087); }
    part(c, sph(.018, 10, 8), SP.red, 0, .005, .09, { noOutline: true });
  }
}

/* rig: g (placed in the world or on furniture) > root (pose offsets) > hip > legs / body > arms / head */
function buildKid(L = state.kid) {
  const hex = (slot, id) => lookOpt(slot, id).hex, T = L.top, dressy = T === 'dress' || T === 'princess', astro = T === 'astro', hero = T === 'hero';
  const skin = solid(hex('skin', L.skin), .7), hs = solid(hex('hairC', L.hairC), .75), shoe = solid(hex('shoes', L.shoes), .45), white = solid('#F4F4F0', .6);
  const topC = hex('topC', L.topC), botC = hex('bottomC', L.bottomC);
  const topS = astro ? white : T === 'stripe' ? cloth(topC, 'stripe') : cloth(topC), bot = astro ? white : cloth(botC);
  const bottom = ONE_PIECE.includes(T) ? (dressy ? 'none' : 'pants') : L.bottom;
  const thighS = dressy ? skin : bot, shinS = bottom === 'pants' ? bot : skin, sleeveS = T === 'hoodie' || hero || astro ? topS : skin;
  const g = new THREE.Group(), root = new THREE.Group(); g.add(root);
  const hip = new THREE.Group(); hip.position.y = .42; root.add(hip);
  const legs = [-1, 1].map(s => {
    const t = new THREE.Group(); t.position.set(s * .07, 0, 0); hip.add(t); part(t, rbox(.1, .22, .11, .045), thighS, 0, -.1, 0);
    const k = new THREE.Group(); k.position.y = -.2; t.add(k); part(k, rbox(.09, .2, .1, .04), shinS, 0, -.09, 0); part(k, rbox(.105, .07, .17, .03), astro ? white : shoe, 0, -.185, .03); return { t, k };
  });
  part(hip, rbox(.25, .11, .16, .05), dressy ? topS : bot, 0, 0, 0);
  const body = new THREE.Group(); hip.add(body);
  part(body, rbox(.27, .34, .17, .07), topS, 0, .17, 0);
  const arms = [-1, 1].map(s => {
    const sh = new THREE.Group(); sh.position.set(s * .17, .31, 0); body.add(sh); part(sh, rbox(.075, .16, .085, .035), topS, 0, -.07, 0);
    const e = new THREE.Group(); e.position.y = -.15; sh.add(e); part(e, rbox(.068, .13, .075, .03), sleeveS, 0, -.06, 0); part(e, sph(.043, 12, 10), astro ? white : skin, 0, -.14, 0); return { s: sh, e };
  });
  const head = new THREE.Group(); head.position.y = .5; body.add(head);
  part(head, sph(.15, 24, 16), skin, 0, 0, 0);
  for (const s of [-1, 1]) { part(head, sph(.019, 10, 8), SP.ink, s * .052, .012, .138, { noOutline: true }); part(head, sph(.025, 10, 8), SP.pinkNose, s * .085, -.035, .12, { noOutline: true, s: [1, .6, .5] }); }
  part(head, torus(.028, .007, PI), SP.ink, 0, -.03, .143, { r: [0, 0, PI], noOutline: true });
  buildHair(head, L.hair, hs); buildHat(head, L.hat, L);
  // clothes details
  const skirts = [], skirt = (m) => { skirts.push({ m, y: m.position.y }); return m; };
  if (dressy) { const big = T === 'princess'; skirt(part(hip, cyl(.14, big ? .34 : .24, big ? .4 : .26, 28, true), cloth(topC, 'double'), 0, big ? -.15 : -.08, 0)); if (big) { for (const s of [-1, 1]) part(body, sph(.07, 14, 10), topS, s * .17, .3, 0); part(hip, torus(.14, .014), SP.brass, 0, .05, 0, { r: [PI / 2, 0, 0] }); } }
  else if (bottom === 'skirt') skirt(part(hip, cyl(.14, .21, .17, 24, true), cloth(botC, 'double'), 0, -.05, 0));
  if (T === 'overall') { part(body, box(.19, .15, .02), bot, 0, .1, .088); for (const s of [-1, 1]) { part(body, box(.035, .2, .02), bot, s * .075, .25, .088); part(body, box(.035, .3, .02), bot, s * .075, .2, -.088); part(body, sph(.014, 8, 6), SP.brass, s * .075, .17, .1, { noOutline: true }); } }
  if (T === 'hoodie') { part(body, torus(.095, .04), topS, 0, .33, -.075, { r: [PI / 2 + .5, 0, 0] }); part(body, box(.16, .07, .015), cloth(shade(topC, -.15)), 0, .06, .088); for (const s of [-1, 1]) rod(body, SP.white, V(s * .035, .3, .088), V(s * .04, .2, .092), .006, { noOutline: true }); }
  if (hero) { part(body, cyl(.065, .065, .014, 24), GLOSS.yellow, 0, .2, .087, { r: [PI / 2, 0, 0] }); part(body, cone(.035, .06, 3), SP.red, 0, .2, .096, { r: [PI / 2, 0, 0], noOutline: true }); part(hip, box(.27, .035, .17), GLOSS.yellow, 0, .045, 0); }
  if (astro) {
    part(body, box(.13, .08, .02), solid('#2F4A7A', .4), 0, .2, .088); [['#E04848', -.035], ['#F4C430', 0], ['#3FBF9B', .035]].forEach(([c, x]) => part(body, sph(.012, 8, 6), solid(c, .3), x, .2, .1, { noOutline: true }));
    part(body, torus(.12, .03), white, 0, .35, 0, { r: [PI / 2, 0, 0] }); part(body, rbox(.22, .26, .1, .03), white, 0, .18, -.13);
    part(head, sph(.235, 28, 18), SP.glass, 0, .01, 0, { noOutline: true });
  }
  const back = hero && L.back === 'none' ? 'cape' : L.back, wings = [];
  if (back === 'bag') { part(body, rbox(.21, .23, .09, .03), GLOSS.yellow, 0, .16, -.125); part(body, rbox(.14, .08, .03, .015), GLOSS.coral, 0, .1, -.17); }
  else if (back === 'cape') { const c = part(body, box(.3, .5, .012), cloth(hero ? '#E04848' : topC, 'double'), 0, .08, -.11, { r: [.12, 0, 0] }); c.userData.cape = true; }
  else if (back === 'wings') for (const s of [-1, 1]) { const w = new THREE.Group(); w.position.set(s * .04, .24, -.1); body.add(w); part(w, sph(.16, 18, 12), wingSpec, s * .13, .04, -.03, { s: [1, 1.35, .06], r: [0, s * .45, s * -.35] }); part(w, sph(.1, 16, 10), wingSpec, s * .1, -.13, -.02, { s: [1, 1.2, .06], r: [0, s * .45, s * .4] }); wings.push(w); }
  g.scale.setScalar(1.15);
  return { g, root, hip, body, head, legs, arms, wings, skirts };
}

/* ---------- poses: every frame starts from neutral, then a pose sets the joints ---------- */
function rigReset(r) {
  r.root.position.set(0, 0, 0); r.root.rotation.set(0, 0, 0); r.hip.position.set(0, .42, 0); r.body.rotation.set(0, 0, 0); r.head.rotation.set(0, 0, 0);
  for (const l of r.legs) { l.t.rotation.set(0, 0, 0); l.k.rotation.set(0, 0, 0); }
  for (const a of r.arms) { a.s.rotation.set(0, 0, 0); a.e.rotation.set(0, 0, 0); }
  for (const k of r.skirts) { k.m.scale.set(1, 1, 1); k.m.position.y = k.y; }
}
// sitting: skirts fold up over the lap instead of poking through the seat
const foldSkirt = r => { for (const k of r.skirts) { k.m.scale.set(1.08, .4, 1.08); k.m.position.y = k.y * .35 + .01; } };
const armsOut = (r, a) => { r.arms[0].s.rotation.z = -a; r.arms[1].s.rotation.z = a; };
function sitLegs(r, t, swing = .12) { r.hip.position.y = .06; foldSkirt(r); r.legs.forEach((l, i) => { l.t.rotation.x = -PI / 2; l.k.rotation.x = PI / 2 + Math.sin(t * 2.2 + i * 2) * swing; }); }
const POSES = {
  stand(r, t) { r.hip.position.y = .42 + Math.sin(t * 2) * .004; armsOut(r, .08); r.head.rotation.y = Math.sin(t * .7) * .15; },
  walk(r, t, ph) {
    const sw = Math.sin(ph) * .55; r.legs[0].t.rotation.x = sw; r.legs[1].t.rotation.x = -sw;
    r.legs[0].k.rotation.x = Math.max(0, Math.sin(ph + 1.4)) * .7; r.legs[1].k.rotation.x = Math.max(0, -Math.sin(ph + 1.4)) * .7;
    r.arms[0].s.rotation.x = -sw * .8; r.arms[1].s.rotation.x = sw * .8; r.arms[0].e.rotation.x = r.arms[1].e.rotation.x = -.35; armsOut(r, .08);
    r.hip.position.y = .42 + Math.abs(Math.cos(ph)) * .025;
  },
  wave(r, t) { POSES.stand(r, t); r.arms[1].s.rotation.z = 2.6 + Math.sin(t * 9) * .3; r.arms[1].e.rotation.z = .3; r.head.rotation.z = -.12; },
  cheer(r, t) { const h = Math.abs(Math.sin(t * 5)); r.root.position.y = h * .12; armsOut(r, 2.5 + h * .3); r.legs.forEach(l => { l.t.rotation.x = -.3 * (1 - h); l.k.rotation.x = .6 * (1 - h); }); },
  dance(r, t) {
    r.root.rotation.y = Math.sin(t * 3) * .5; r.root.position.y = Math.abs(Math.sin(t * 6)) * .05; r.hip.position.x = Math.sin(t * 6) * .03;
    armsOut(r, 1.4 + Math.sin(t * 6) * .9); r.arms.forEach(a => a.e.rotation.z = Math.sin(t * 6) * .6);
    r.legs.forEach((l, i) => { const k = Math.max(0, Math.sin(t * 6 + i * PI)); l.t.rotation.x = -k * .6; l.k.rotation.x = k * 1.0; }); r.head.rotation.z = Math.sin(t * 6) * .15;
  },
  spin(r, t) { r.root.rotation.y = t * 6; armsOut(r, 1.45); r.head.rotation.x = -.15; r.root.position.y = Math.abs(Math.sin(t * 6)) * .03; },
  hop(r, t) { const c = (t * 1.3) % 1, h = 4 * c * (1 - c); r.root.position.y = h * .35; armsOut(r, .3 + h * 2.3); r.legs.forEach(l => { l.t.rotation.x = -.7 * h; l.k.rotation.x = 1.2 * h; }); },
  sit(r, t) { sitLegs(r, t); r.arms.forEach(a => { a.s.rotation.x = -.45; a.e.rotation.x = -.7; }); armsOut(r, .12); r.head.rotation.y = Math.sin(t * .6) * .25; },
  lean(r, t) { POSES.sit(r, t); r.body.rotation.x = -.3; r.head.rotation.x = .2; armsOut(r, .5); },
  lie(r, t) { foldSkirt(r); r.root.rotation.x = -PI / 2; r.root.position.y = .09; armsOut(r, .15); r.body.rotation.x = Math.sin(t * 1.3) * .012; r.head.rotation.y = .25; },
  swing(r, t) { const s = Math.sin(t * 1.5); sitLegs(r, t, 0); r.legs.forEach(l => { l.t.rotation.x = -PI / 2 + s * .25; l.k.rotation.x = PI / 2 - s * .55; }); r.arms.forEach(a => { a.s.rotation.x = -2.8; }); r.body.rotation.x = -s * .15; },
  jump(r, t) { const c = (t * 1.15) % 1, h = 4 * c * (1 - c); r.root.position.y = h * .8; armsOut(r, .4 + h * 2.2); r.legs.forEach(l => { l.t.rotation.x = -.5 * (1 - h) - .3 * h; l.k.rotation.x = 1.0 * (1 - h) + .4 * h; }); r.head.rotation.x = -.2 * h; },
  ride(r, t) { r.hip.position.y = .07; foldSkirt(r); r.legs.forEach((l, i) => { l.t.rotation.x = -1.3; l.t.rotation.z = (i ? 1 : -1) * .4; l.k.rotation.x = 1.25; }); r.arms.forEach(a => { a.s.rotation.x = -1.3; a.e.rotation.x = -.2; }); r.body.rotation.x = .12 + Math.sin(t * 1.6) * .06; },
  dig(r, t) { r.hip.position.y = .06; foldSkirt(r); r.legs.forEach((l, i) => { l.t.rotation.x = -PI / 2; l.t.rotation.z = (i ? 1 : -1) * .25; l.k.rotation.x = .3; }); r.arms[1].s.rotation.x = -.9 + Math.sin(t * 5) * .4; r.arms[1].e.rotation.x = -.6; r.arms[0].s.rotation.x = -.4; r.body.rotation.x = .25; r.head.rotation.x = .25; },

function genCn(lv) {

    case 'jin': { const [a, b, w] = pick(YW.jin); return { visual: { text: a, big: true }, prompt: `“${a}”的近义词是？`, options: shuffle([b, ...w]), answer: b, explain: `“${a}”和“${b}”意思差不多，是近义词。` }; }

    case 'bs': { const [c, a] = pick(YW.bs); const names = [...new Set(YW.bs.map(x => x[1]))].filter(x => x !== a);
      return { visual: { text: c, big: true }, prompt: `“${c}”字是什么偏旁？`, options: shuffle([a, ...shuffle(names).slice(0, 3)]), answer: a, explain: `“${c}”的偏旁是${a}。` }; }

let dressTab = 'hair', dressPend = null, dR = null, dScene, dCam, dEnv, dKid = null, dAct = null, dYaw = .5, dDrag = null, dRAF = 0, dLast = 0;
const thumbCache = {};
function kidThumb(L, view) {
  const key = MODE + view + JSON.stringify({ ...L, name: 0, pose: 0 }); if (thumbCache[key]) return thumbCache[key];
  try {
    initThumbR(); const r = buildKid(L); rigReset(r); POSES.stand(r, 0); r.head.rotation.y = 0; tScene.add(r.g);
    if (view === 'head') { tCam.position.set(.3, 1.17, 1.0); tCam.lookAt(0, 1.08, 0); }
    else if (view === 'back') { tCam.position.set(-1.05, 1.05, -2.3); tCam.lookAt(0, .72, 0); }
    else { tCam.position.set(.9, .95, 2.55); tCam.lookAt(0, .66, 0); }
    tR.render(tScene, tCam); tScene.remove(r.g); return thumbCache[key] = tR.domElement.toDataURL('image/png');
  } catch (e) { return ''; }
}
function openDress() { dressPend = null; dAct = null; openModal('#dressModal'); renderDress(); dressPreview(state.kid); if (!dRAF) { dLast = performance.now(); dressLoop(); } }
function renderDress() {
  const L = state.kid; $('#dressStars').textContent = state.points; const nIn = $('#kidNameIn'); if (document.activeElement !== nIn) nIn.value = L.name;
  $('#dressSub').textContent = `给${kidName()}换发型、换衣服，再教${kidName()}做个动作`;
  $('#dressTabs').innerHTML = DRESS_TABS.map(([k, n]) => `<button data-tab="${k}" class="${k === dressTab ? 'on' : ''}">${n}</button>`).join('');
  $('#dressActs').innerHTML = FREE_ACTS.map(([k, n]) => `<button data-act="${k}" class="${dAct?.k === k ? 'on' : ''}">${n}</button>`).join('');
  const shown = dressPend ? { ...L, [dressPend.slot]: dressPend.id } : L;
  const price = (slot, o) => lookLocked(slot, o.id) ? `<em>${STAR}${o.price}</em>` : '';
  const cards = (slot, view) => `<div class="lgrid">${LOOK[slot].map(o => `<button class="lcard ${shown[slot] === o.id ? 'on' : ''} ${lookLocked(slot, o.id) ? 'locked' : ''}" data-slot="${slot}" data-id="${o.id}"><img src="${kidThumb({ ...L, [slot]: o.id }, view)}" alt="">${o.name}${price(slot, o)}</button>`).join('')}</div>`;
  const dots = slot => `<div class="ldots">${LOOK[slot].map(o => `<button class="ldot ${shown[slot] === o.id ? 'on' : ''}" data-slot="${slot}" data-id="${o.id}" title="${o.name || ''}" aria-label="${o.name || o.id}" style="background:${o.hex}">${price(slot, o)}</button>`).join('')}</div>`;
  const sect = (t, en) => `<div class="sect">${t} <span>${en}</span></div>`;
  let h = '';
  if (dressTab === 'hair') h = sect('发型', 'Hairstyle') + cards('hair', 'head') + sect('发色', 'Hair color') + dots('hairC');
  else if (dressTab === 'top') {
    const T = shown.top, one = ONE_PIECE.includes(T), dressy = T === 'dress' || T === 'princess';
    h = sect('衣服', 'Outfit') + cards('top', 'full') + (T === 'astro' ? '' : sect('衣服颜色', 'Color') + dots('topC'))
      + (dressy || T === 'astro' ? '' : one ? sect('裤子颜色', 'Pants') + dots('bottomC') : sect('下装', 'Bottoms') + cards('bottom', 'full') + dots('bottomC'))
      + sect('鞋子', 'Shoes') + dots('shoes');
  } else if (dressTab === 'acc') h = sect('头上戴', 'Head') + cards('hat', 'head') + sect('背上背', 'Back') + cards('back', 'back');
  else h = sect('肤色', 'Skin') + dots('skin') + '<p class="lnote">每个小朋友都不一样，挑一个最像你的吧。</p>';
  $('#dressOpts').innerHTML = h; renderDressBuy();
}
function renderDressBuy() {
  const el = $('#dressBuy'), p = dressPend; el.hidden = !p; if (!p) return;
  const o = lookOpt(p.slot, p.id), need = o.price - state.points;
  el.innerHTML = `<span>正在试穿<b>${o.name}</b>，兑换后就能一直穿</span>`
    + (need > 0 ? `<small>还差 ${need} 颗星星</small><button class="btn btn-sun" data-earn>去答题赚星星</button>` : `<button class="btn btn-berry" data-buylook>${STAR}${o.price} 兑换</button>`)
    + '<button class="btn btn-ghost" data-cancel>不要了</button>';
}
function wearLook(slot, id) { state.kid[slot] = id; save(); rebuildKid(); if (VIEW === 'house') renderHousePanel(); }
$('#dressTabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; dressTab = b.dataset.tab; sfx('tap'); renderDress(); };
$('#dressOpts').onclick = e => {
  const b = e.target.closest('[data-slot]'); if (!b) return; const { slot, id } = b.dataset;
  if (lookLocked(slot, id)) { dressPend = { slot, id }; sfx('tap'); dressPreview({ ...state.kid, [slot]: id }); renderDress(); return; }
  dressPend = null; wearLook(slot, id); sfx('pop'); dressPreview(state.kid); renderDress();
};
$('#dressBuy').onclick = e => {
  const p = dressPend; if (!p) return;
  if (e.target.closest('[data-buylook]')) {
    const o = lookOpt(p.slot, p.id); if (state.points < o.price) return;
    state.points -= o.price; state.owned.push(`look:${p.slot}:${p.id}`); dressPend = null; wearLook(p.slot, p.id);
    renderPoints(); sfx('coin'); confetti(); toast(`兑换成功！${kidName()}换上了${o.name}`); dressPreview(state.kid); renderDress();
  } else if (e.target.closest('[data-earn]')) { closeModal('#dressModal'); openModal('#quizModal'); renderQuizHome(); }
  else if (e.target.closest('[data-cancel]')) { dressPend = null; dressPreview(state.kid); renderDress(); }
};
$('#dressActs').onclick = e => { const b = e.target.closest('[data-act]'); if (!b) return; dAct = { k: b.dataset.act, t0: clock.elapsedTime }; sfx('pop'); renderDress(); };
$('#kidNameIn').oninput = e => { state.kid.name = e.target.value.trim().slice(0, 6) || '小糖'; save(); $('#dressSub').textContent = `给${kidName()}换发型、换衣服，再教${kidName()}做个动作`; if (VIEW === 'house') renderHousePanel(); };
function dressPreview(L) {
  if (!dR) {
    const c = $('#dressCv'); dR = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true }); dR.setPixelRatio(Math.min(devicePixelRatio, 2)); dR.shadowMap.enabled = true; dR.shadowMap.type = THREE.PCFSoftShadowMap;
    dScene = new THREE.Scene(); dCam = new THREE.PerspectiveCamera(30, 1, .1, 30);
    dScene.add(new THREE.HemisphereLight('#F4F8FF', '#C9B8A6', 1.2)); const d = new THREE.DirectionalLight('#ffffff', 2.4); d.position.set(2, 4, 3); d.castShadow = true; d.shadow.mapSize.set(1024, 1024);
    Object.assign(d.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 }); d.shadow.normalBias = .02; dScene.add(d);
    dEnv = new THREE.PMREMGenerator(dR).fromScene(new RoomEnvironment(), .04).texture;
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(.72, .78, .1, 56), new THREE.MeshStandardMaterial({ color: '#FFFFFF', roughness: .5 })); ped.position.y = -.05; ped.receiveShadow = true; dScene.add(ped);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.75, .02, 10, 64), new THREE.MeshStandardMaterial({ color: '#FFB21E', roughness: .4 })); rim.rotation.x = PI / 2; dScene.add(rim);
    c.addEventListener('pointerdown', e => { dDrag = { x: e.clientX, yaw: dYaw }; c.setPointerCapture(e.pointerId); c.style.cursor = 'grabbing'; });
    c.addEventListener('pointermove', e => { if (dDrag) dYaw = dDrag.yaw + (e.clientX - dDrag.x) * .012; });
    const up = () => { dDrag = null; c.style.cursor = ''; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  dScene.environment = MODE === 'toon' ? null : dEnv; dR.toneMapping = MODE === 'toon' ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  if (dKid) dScene.remove(dKid.g); dKid = buildKid(L); dKid.g.traverse(o => { if (o.isMesh) o.castShadow = true; }); dScene.add(dKid.g);
}
function dressLoop(now = performance.now()) {
  if ($('#dressModal').hidden) { dRAF = 0; return; }
  dRAF = requestAnimationFrame(dressLoop); const dt = Math.min(.05, (now - dLast) / 1000); dLast = now;
  const c = dR.domElement, w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  if (c.width !== Math.round(w * dR.getPixelRatio())) { dR.setSize(w, h, false); }
  dCam.aspect = w / h; dCam.position.set(0, .95, 3.9 * Math.max(1, .8 / dCam.aspect)); dCam.lookAt(0, .66, 0); dCam.updateProjectionMatrix();
  const t = clock.elapsedTime, r = dKid; rigReset(r);
  if (dAct && t - dAct.t0 < 3.4) POSES[dAct.k](r, t - dAct.t0); else { if (dAct) { dAct = null; renderDress(); } POSES.stand(r, t); }
  for (const wg of r.wings) wg.rotation.y = Math.sin(t * 6) * .25 * (wg.position.x < 0 ? -1 : 1);
  if (!dDrag) dYaw += dt * .35; r.g.rotation.y = dYaw;

/* ================= loop ================= */
function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const clock = new THREE.Clock(), selBox = new THREE.Box3(), selTop = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (camAnim) { camAnim.t = Math.min(1, camAnim.t + dt * 1.4); const k = 1 - (1 - camAnim.t) ** 3; camera.position.lerpVectors(camAnim.from, camAnim.to, k); controls.target.lerpVectors(camAnim.ft, camAnim.tt, k); if (camAnim.t >= 1) { controls.update(); Object.assign(controls, camAnim.lim); camAnim = null; controls.enabled = true; } }
  controls.update(); kidTick(dt, t); portalsTick();
  if (hovered) { const p = AREAS[hovered].proxy, b = hoverBox.box; tmpV.set((b.min.x + b.max.x) / 2, b.max.y, (b.min.z + b.max.z) / 2).project(camera); const l = $('#areaLabel'); l.style.left = `${(tmpV.x + 1) / 2 * stage.clientWidth}px`; l.style.top = `${clamp((1 - tmpV.y) / 2 * stage.clientHeight, 70, stage.clientHeight)}px`; }

  }
  if (selected) {
    const rec = selected.userData.rec, it = selected.userData.item;
    if (!rec) { wallBox.visible = false; ring.visible = true; selected.getWorldPosition(ring.position); ring.position.y += .02; ring.scale.setScalar(.42 + Math.sin(t * 4) * .01); }
    else if (rec.wall) { ring.visible = false; wallBox.box.setFromObject(selected).expandByScalar(.03); wallBox.visible = true; }
    else { wallBox.visible = false; ring.visible = true; selected.getWorldPosition(ring.position); ring.position.y += .015; const rr = Math.hypot(...it.fp) / 2 + .12; ring.scale.setScalar(rr * (1 + Math.sin(t * 4) * .02)); }
    selBox.setFromObject(selected); selTop.set((selBox.min.x + selBox.max.x) / 2, selBox.max.y + .05, (selBox.min.z + selBox.max.z) / 2).project(camera);
    const w = stage.clientWidth, h = stage.clientHeight, tw = selTools.offsetWidth / 2;
    selTools.style.left = `${clamp((selTop.x + 1) / 2 * w, tw + 8, w - tw - 8)}px`; selTools.style.top = `${clamp((1 - selTop.y) / 2 * h, selTools.offsetHeight + 24, h - 8)}px`;
  }
  renderer.render(scene, camera);
}

/* ================= boot ================= */
applyExterior(); buildGround(); buildAll(); kidPlace('f0c0'); if (state.kid.pose && !state.areas[state.kid.pose.area]?.items.some(r => r.uid === state.kid.pose.uid)) state.kid.pose = null;
$('#soundBtn use').setAttribute('href', state.sound ? '#i-sound' : '#i-mute');
resize(); applyMode(); setView(state.view || 'house', false); renderPoints(false);
$('#loading').hidden = true; loop();
</script>
